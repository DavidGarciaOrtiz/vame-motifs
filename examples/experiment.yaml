# ---------------------------------------------------------------------------
# One experiment = one YAML file. Copy it next to your data and edit it.
# Relative paths are relative to THIS file, so the command works from any folder.
# ---------------------------------------------------------------------------

input:
  pose_files: /pool01/projects/abante_lab/dopamap_beh/results_analysis/01022023_001_16236-62755DLC_Resnet50_Test-ExampleSep16shuffle1_snapshot_best-84_filtered.csv        # a folder of DeepLabCut .csv files, or one .csv file
  videos: /pool01/projects/abante_lab/dopamap_beh/results_analysis/01022023_001_16236-62755DLC_Resnet50_Test-ExampleSep16shuffle1_snapshot_best-84_filtered_p60_labeled.mp4       # optional: folder of raw .mp4/.avi videos, or one file; needed for 'vame-motifs videos'
  fps: 30                         # frame rate of the recordings

keypoints:                        # names exactly as in the CSV header ('validate' lists them)
  align_center: snout            # body part placed at (0, 0) by egocentric alignment
  align_direction: tail       # body part that sets the orientation
  exclude: []                     # body parts to leave out of the model, e.g. [tail_end]

cleaning:
  min_confidence: 0.9             # points with DLC likelihood below this are discarded and filled in

motifs:
  n_clusters: 15                  # number of motifs to look for
  method: hmm                     # hmm | kmeans | both  (hmm is slower but smoother)

output: outputs                   # VAME project, motif CSVs and run records go here

# Optional. Defaults shown; most analyses never change them.
# Changing time_window or zdims needs retraining: 'vame-motifs run --force'.
advanced:
  max_epochs: 100
  time_window: 30                 # frames per window; also sets the label offset in the CSVs
  zdims: 30                       # size of the latent space
  seed: 42                        # same seed + same data = same motifs
  community_cut_tree: 3           # how finely motifs are grouped into communities for 'videos' folders (higher = more, smaller communities)
